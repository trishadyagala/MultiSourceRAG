<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Room — multi-source RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <h1>Reading Room</h1>
      <p class="subtitle">Ask questions across everything you've fed it — PDFs, pages, notes.</p>
      <span class="status" id="status">0 sources indexed</span>
    </header>

    <aside class="library">
      <h2>Library</h2>

      <div class="add-source">
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="url" type="button">URL</button>
          <button class="tab" data-tab="file" type="button">File</button>
          <button class="tab" data-tab="note" type="button">Note</button>
        </div>

        <form id="form-url" class="tab-panel active" data-panel="url">
          <input type="url" id="url-input" placeholder="https://example.com/article" required />
          <button type="submit">Add page</button>
        </form>

        <form id="form-file" class="tab-panel" data-panel="file">
          <input type="file" id="file-input" accept=".pdf,.txt,.md" required />
          <button type="submit">Add document</button>
        </form>

        <form id="form-note" class="tab-panel" data-panel="note">
          <input type="text" id="note-name" placeholder="Label (optional)" />
          <textarea id="note-text" rows="4" placeholder="Paste or write a note to index…" required></textarea>
          <button type="submit">Add note</button>
        </form>

        <p class="hint" id="ingest-hint"></p>
      </div>

      <ol class="source-list" id="source-list">
        <li class="empty-state">No sources yet — add one above.</li>
      </ol>
    </aside>

    <main class="reading">
      <div class="answer-area" id="answer-area">
        <div class="placeholder">
          <p>Your answer will appear here, with citations back to the passages it drew from.</p>
        </div>
      </div>

      <form id="form-ask" class="ask-bar">
        <input type="text" id="question-input" placeholder="Ask something about your sources…" autocomplete="off" required />
        <button type="submit" id="ask-button">Ask</button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
